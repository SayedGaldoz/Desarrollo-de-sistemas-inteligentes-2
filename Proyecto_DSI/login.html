<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/signin.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center bg-light">

  <main class="form-signin w-100 m-auto">
    <form id="formLogin">
      <h1 class="h3 mb-3 text-center">Iniciar sesión</h1>

      <div id="alertaError" class="alert alert-danger d-none">Datos incorrectos</div>

      <div class="form-floating">
        <input type="email" class="form-control" id="email" placeholder="correo" required>
        <label for="email">Correo</label>
      </div>
      <div class="form-floating">
        <input type="password" class="form-control" id="password" placeholder="contraseña" required>
        <label for="password">Contraseña</label>
      </div>

      <button class="btn btn-primary w-100" type="submit">Entrar</button>
      <p class="mt-3 text-center"><a href="index.html">Volver</a></p>
      <p class="text-muted small text-center">admin@dsi.com / admin123</p>
    </form>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
